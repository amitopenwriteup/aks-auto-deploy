apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-auto-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-auto-deploy
  template:
    metadata:
      labels:
        app: aks-auto-deploy
    spec:
      containers:
        - name: aks-auto-deploy
          image: amitack.azurecr.io/aks-auto-deploy:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
